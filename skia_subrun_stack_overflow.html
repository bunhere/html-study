<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<!-- 한 줄짜리 텍스트에 폰트(라틴/컬러 이모지/CJK)를 번갈아 섞어 하나의 SkTextBlob 에
     수만 개의 run → 수만 개의 Skia SubRun 을 만든다. ?n= 으로 반복 횟수 조절. -->
<style>
  body { margin: 0; }
  #t { white-space: pre; font: 14px sans-serif; }
</style>
<p id="info"></p>
<div id="t"></div>
<script>
  const n = +(new URLSearchParams(location.search).get('n') || 30000);
  document.getElementById('info').textContent = 'n=' + n;
  document.getElementById('t').textContent = 'a😀가'.repeat(n);
</script>
