<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ★ 일부러 viewport 메타를 넣지 않음 → 데스크톱 폴백 폭(≈980) 레이아웃 → device_scale_adjustment(FSM) 적용 + 폭비율≫1 → autosizing 발동 조건 성립 -->
<title>Text Autosizing capability 테스트 (뷰포트 메타 없음)</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  /* 뷰포트 메타가 없어 화면이 ~980px로 축소되어 보이므로, 리포트 글자를 크게 잡아 가독성 확보 */
  body { margin:0; padding:24px; font-family:-apple-system,"Noto Sans KR",sans-serif; font-size:26px; line-height:1.5; background:#fff; color:#111; }
  @media (prefers-color-scheme: dark){ body{background:#16181c;color:#e7e9ee;} .card{background:#21242b!important;border-color:#333!important;} th{background:#2a2e37!important;} }
  h1 { font-size:34px; margin:0 0 4px; }
  .sub { font-size:22px; opacity:.7; margin:0 0 20px; }
  .verdict { font-size:38px; font-weight:800; text-align:center; padding:28px; border-radius:16px; margin:0 0 20px; background:#eee; color:#333; }
  .verdict.on { background:#16a34a; color:#fff; } .verdict.off { background:#64748b; color:#fff; }
  .verdict small { display:block; font-size:22px; font-weight:500; opacity:.92; margin-top:10px; }
  .card { background:#f7f8fa; border:2px solid #e2e5ea; border-radius:14px; padding:18px 20px; margin:0 0 18px; }
  .card h2 { font-size:24px; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:22px; }
  th,td { text-align:left; padding:10px 12px; border-bottom:2px solid #e2e5ea; }
  td.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  button { font-size:28px; padding:16px 28px; border:0; border-radius:12px; background:#2563eb; color:#fff; font-weight:700; width:100%; }
  .note { font-size:20px; opacity:.78; }
  .measure { font-size:12px; overflow:hidden; border:2px dashed #cbd5e1; border-radius:10px; padding:10px; }
  .measure.auto { -webkit-text-size-adjust:auto; text-size-adjust:auto; }
  .measure.none { -webkit-text-size-adjust:none; text-size-adjust:none; }
  .probe { white-space:nowrap; font-weight:700; }
</style>
</head>
<body>
  <h1>Autosizing capability 테스트</h1>
  <p class="sub">이 페이지는 <b>뷰포트 메타가 없어</b> 축소되어 보이는 게 정상입니다. autosizing이 지원되면 여기선 반드시 발동합니다.</p>

  <div id="verdict" class="verdict">측정 중…</div>

  <div class="card">
    <h2>측정 결과</h2>
    <table><thead><tr><th>항목</th><th class="num">실측 폭(px)</th><th class="num">기준 대비</th><th class="num">computed px</th></tr></thead>
    <tbody id="rows"></tbody></table>
    <p class="note" style="margin-top:10px">긴 텍스트 auto ÷ none &gt; 1 이면 autosizing <b>지원·발동</b>. 값이 곧 배율(폭≫뷰포트라 보통 2~3배).</p>
  </div>

  <div class="card"><h2>환경</h2><table><tbody id="env"></tbody></table></div>

  <button id="remeasure">다시 측정</button>

  <div style="position:absolute; left:-99999px; top:0; width:980px;" aria-hidden="true">
    <div id="mAuto" class="measure auto"></div>
    <div id="mNone" class="measure none"></div>
  </div>

<script>
  var PROBE = "MMMMMMMMMMMMMMMMMMMMMMMMMMMMMM";
  var FILLER = ("웨일 텍스트 오토사이징 capability 측정용 문단. This filler exceeds the four-line minimum so the block becomes an autosizing cluster. 넉넉한 본문으로 클러스터가 오토사이즈 대상이 되게 합니다. ").repeat(8);
  function fill(el){ el.innerHTML = FILLER + ' <span class="probe">'+PROBE+'</span> ' + FILLER; }
  function pW(c){ var p=c.querySelector('.probe'); return p?p.getBoundingClientRect().width:0; }
  function pF(c){ var p=c.querySelector('.probe'); return p?parseFloat(getComputedStyle(p).fontSize):0; }
  function fnum(x,d){ return (!x||isNaN(x))?"—":x.toFixed(d===undefined?2:d); }

  function measure(){
    fill(document.getElementById('mAuto')); fill(document.getElementById('mNone'));
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      var wA=pW(document.getElementById('mAuto')), wN=pW(document.getElementById('mNone'));
      var fA=pF(document.getElementById('mAuto')), fN=pF(document.getElementById('mNone'));
      var ratio = wN ? wA/wN : 0, csRatio = fN ? fA/fN : 0;
      document.getElementById('rows').innerHTML =
        '<tr><td>긴 텍스트 · none (기준)</td><td class="num">'+fnum(wN,1)+'</td><td class="num">기준</td><td class="num">'+fnum(fN,1)+'</td></tr>'+
        '<tr><td>긴 텍스트 · auto</td><td class="num">'+fnum(wA,1)+'</td><td class="num">×'+fnum(ratio)+'</td><td class="num">'+fnum(fA,1)+'</td></tr>';
      var on = ratio>1.01, v=document.getElementById('verdict');
      v.className='verdict '+(on?'on':'off');
      v.innerHTML=(on?'autosizing: 지원·발동 ✔':'autosizing: 미발동 ✘')+
        '<small>배율 ×'+fnum(ratio)+(csRatio>1.01?' · computed 반영(Chromium형)':' · computed 미반영(Firefox형/off)')+'</small>';
      var vv=window.visualViewport;
      document.getElementById('env').innerHTML=[
        ['innerWidth(레이아웃 폭)', window.innerWidth+' px  ← 980 근처면 데스크톱 폴백 정상'],
        ['screen×dpr', screen.width+' × '+window.devicePixelRatio],
        ['visualViewport', vv?Math.round(vv.width)+' × '+Math.round(vv.height):'없음'],
        ['userAgent', navigator.userAgent]
      ].map(function(e){return '<tr><td style="white-space:nowrap">'+e[0]+'</td><td style="word-break:break-all">'+e[1]+'</td></tr>';}).join('');
    });});
  }
  document.getElementById('remeasure').addEventListener('click', measure);
  window.addEventListener('load', measure);
  window.addEventListener('resize', measure);
</script>
</body>
</html>
